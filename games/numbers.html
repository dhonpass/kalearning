<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>Number Garden - Tibetan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+Tibetan:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Baloo 2", "Noto Sans Tibetan", cursive;
        background: linear-gradient(
          180deg,
          #fff7d6 0%,
          #ffe4f1 30%,
          #d6f0ff 70%,
          #e0d4ff 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
        position: relative;
        overflow-x: hidden;
      }

      body {
        font-family: "Baloo 2", "Noto Sans Tibetan", cursive;
        background: linear-gradient(
          180deg,
          #fff7d6 0%,
          #ffe4f1 30%,
          #d6f0ff 70%,
          #e0d4ff 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        position: relative;
        overflow-x: hidden;
      }

      /* Floating colorful bubbles */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 15% 20%,
            rgba(255, 154, 0, 0.18) 0 120px,
            transparent 121px
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(255, 90, 138, 0.18) 0 140px,
            transparent 141px
          ),
          radial-gradient(
            circle at 20% 85%,
            rgba(46, 196, 182, 0.18) 0 160px,
            transparent 161px
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(139, 92, 246, 0.16) 0 130px,
            transparent 131px
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(255, 207, 51, 0.12) 0 200px,
            transparent 201px
          );
        animation: floatBubbles 25s ease-in-out infinite;
        z-index: -2;
        pointer-events: none;
      }

      /* Faint floating emojis */
      body::after {
        content: "🌈 ⭐ 🎈 🌸 🦋";
        position: fixed;
        top: 10%;
        left: 0;
        right: 0;
        font-size: clamp(24px, 5vw, 40px);
        opacity: 0.12;
        display: flex;
        justify-content: space-around;
        animation: drift 30s linear infinite;
        z-index: -1;
        pointer-events: none;
        white-space: nowrap;
      }

      @keyframes floatBubbles {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.05);
        }
      }
      @keyframes drift {
        0% {
          transform: translateX(-10%);
        }
        100% {
          transform: translateX(10%);
        }
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 15% 20%,
            rgba(255, 154, 0, 0.18) 0 120px,
            transparent 121px
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(255, 90, 138, 0.18) 0 140px,
            transparent 141px
          ),
          radial-gradient(
            circle at 20% 85%,
            rgba(46, 196, 182, 0.18) 0 160px,
            transparent 161px
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(139, 92, 246, 0.16) 0 130px,
            transparent 131px
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(255, 207, 51, 0.12) 0 200px,
            transparent 201px
          );
        animation: floatBubbles 25s ease-in-out infinite;
        z-index: -2;
        pointer-events: none;
      }
      body::after {
        content: "🌈 ⭐ 🎈 🌸 🦋";
        position: fixed;
        top: 10%;
        left: 0;
        right: 0;
        font-size: clamp(24px, 5vw, 40px);
        opacity: 0.12;
        display: flex;
        justify-content: space-around;
        animation: drift 30s linear infinite;
        z-index: -1;
        pointer-events: none;
        white-space: nowrap;
      }
      @keyframes floatBubbles {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.05);
        }
      }
      @keyframes drift {
        0% {
          transform: translateX(-10%);
        }
        100% {
          transform: translateX(10%);
        }
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 70px; /* ← ADDS THE TOP GAP like screenshot 1 */
        margin-bottom: 22px; /* a little more space below title */
      }
      .header h1 {
        font-size: clamp(24px, 5.5vw, 32px);
        color: #d63384;
        font-weight: 800;
      }
      .header span {
        font-size: 24px;
        animation: bounce 2s ease-in-out infinite;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .game-box {
        background: #fff;
        border-radius: 28px;
        padding: 20px 16px;
        width: 100%;
        max-width: 460px;
        box-shadow:
          0 10px 0 #f0d0e8,
          0 6px 20px rgba(0, 0, 0, 0.08);
      }
      .numbers {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        min-height: 140px;
        align-content: flex-start;
      }
      .num {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        color: #fff;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
        transition: transform 0.15s;
        user-select: none;
        position: relative;
        margin: 3px;
        font-family: "Noto Sans Tibetan", "Baloo 2", sans-serif;
      }
      .num:active {
        cursor: grabbing;
      }
      .num.dragging {
        z-index: 999;
        transform: scale(1.12) rotate(3deg);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      }
      .num::after {
        content: "😊";
        position: absolute;
        bottom: -6px;
        font-size: 11px;
        opacity: 0.9;
        font-family: "Baloo 2";
      }

      .slots {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        max-width: 340px;
        margin: 0 auto;
      }
      .slot {
        aspect-ratio: 1;
        background: #f8f5ff;
        border: 2px dashed #e0d4f7;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        color: #d4c5f0;
        transition: 0.2s;
        position: relative;
        font-family: "Noto Sans Tibetan", "Baloo 2", sans-serif;
      }
      .slot.hover {
        border-color: #ff7eb8;
        background: #fff0f8;
        transform: scale(1.05);
        color: #ffc4e1;
      }
      .slot.done {
        background: #e8fff0;
        border-style: solid;
        border-color: #7ee89a;
        color: transparent;
      }
      .slot .num {
        position: absolute !important;
        width: 85% !important;
        height: 85% !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12) !important;
        font-size: 28px !important;
        cursor: default;
      }

      .controls {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 460px;
        margin-top: 16px;
      }
      .btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 16px;
        font-family: "Baloo 2";
        font-weight: 800;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
        transition: 0.1s;
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
      }
      .btn-pink {
        background: #ff5fa2;
        color: #fff;
      }
      .btn-white {
        background: #fff;
        color: #d63384;
      }

      .exit {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #d63384;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        font-weight: 800;
        z-index: 100;
      }

      .popup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }
      .popup.show {
        display: flex;
        animation: fade 0.3s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .card {
        background: #fff;
        border-radius: 28px;
        padding: 36px 26px;
        text-align: center;
        max-width: 300px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        animation: pop 0.4s cubic-bezier(0.2, 1.5, 0.5, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .stars {
        font-size: 56px;
        margin-bottom: 8px;
        animation: bounce 1s ease infinite;
      }
      .card h2 {
        font-size: 30px;
        color: #d63384;
        margin-bottom: 6px;
        font-family: "Baloo 2";
      }
      .card p {
        color: #666;
        font-size: 17px;
        margin-bottom: 20px;
        font-family: "Baloo 2";
      }
    </style>
  </head>
  <body>
    <a href="#" class="exit" id="exitBtn">×</a>

    <div class="header">
      <span>🔢</span>
      <h1>Number Garden</h1>
      <span style="animation-delay: 0.5s">🔢</span>
    </div>

    <div class="game-box">
      <div class="numbers" id="numbers"></div>
      <div class="slots" id="slots"></div>
    </div>

    <div class="controls">
      <button class="btn btn-pink" id="replayBtn">🔀 Replay</button>
      <button class="btn btn-white" id="homeBtn">🏠 Home</button>
    </div>

    <div class="popup" id="popup">
      <div class="card">
        <div class="stars">🌟</div>
        <h2>ལེགས་སོ!</h2>
        <p>Perfect!</p>
        <button
          class="btn btn-pink"
          onclick="
            closePopup();
            init();
          "
          style="width: 100%"
        >
          Play Again
        </button>
      </div>
    </div>

    <script>
      const HOME_URL = "../games.html",
        EXIT_URL = "../games.html";

      // Tibetan numerals mapping
      const TIBETAN = ["༠", "༡", "༢", "༣", "༤", "༥", "༦", "༧", "༨", "༩"];
      function toTibetan(num) {
        return String(num)
          .split("")
          .map((d) => TIBETAN[parseInt(d)])
          .join("");
      }

      const NUMBERS = [
        { n: 1, c: "#ff6b6b" },
        { n: 2, c: "#4dabf7" },
        { n: 3, c: "#ffd43b" },
        { n: 4, c: "#51cf66" },
        { n: 5, c: "#9775fa" },
        { n: 6, c: "#ff922b" },
        { n: 7, c: "#f783ac" },
        { n: 8, c: "#20c997" },
        { n: 9, c: "#845ef7" },
        { n: 10, c: "#fd7e14" },
      ];
      let drag = null,
        matched = 0,
        audio;
      function ding() {
        try {
          audio = audio || new (window.AudioContext || webkitAudioContext)();
          const o = audio.createOscillator(),
            g = audio.createGain();
          o.connect(g);
          g.connect(audio.destination);
          o.frequency.setValueAtTime(700, audio.currentTime);
          o.frequency.exponentialRampToValueAtTime(
            1000,
            audio.currentTime + 0.12,
          );
          g.gain.setValueAtTime(0.18, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
          o.start();
          o.stop(audio.currentTime + 0.16);
        } catch (e) {}
      }

      function init() {
        const nums = document.getElementById("numbers"),
          slots = document.getElementById("slots");
        nums.innerHTML = "";
        slots.innerHTML = "";
        matched = 0;

        // TOP: shuffled randomly - show Tibetan
        [...NUMBERS]
          .sort(() => Math.random() - 0.5)
          .forEach((item) => {
            const d = document.createElement("div");
            d.className = "num";
            d.dataset.num = item.n;
            d.textContent = toTibetan(item.n);
            d.style.background = item.c;
            d.style.boxShadow = `0 5px 0 ${item.c}aa`;
            d.onpointerdown = startDrag;
            nums.appendChild(d);
          });

        // BOTTOM: in order 1-10 - show Tibetan
        NUMBERS.forEach((item) => {
          const s = document.createElement("div");
          s.className = "slot";
          s.dataset.num = item.n;
          s.textContent = toTibetan(item.n);
          slots.appendChild(s);
        });
      }

      function startDrag(e) {
        drag = this;
        const r = this.getBoundingClientRect();
        this.style.position = "fixed";
        this.style.left = r.left + "px";
        this.style.top = r.top + "px";
        this.style.width = r.width + "px";
        this.style.height = r.height + "px";
        this.style.zIndex = "999";
        document.body.appendChild(this);
        this.classList.add("dragging");
        this.setPointerCapture(e.pointerId);
        const ox = e.clientX - r.left,
          oy = e.clientY - r.top;

        const move = (ev) => {
          drag.style.left = ev.clientX - ox + "px";
          drag.style.top = ev.clientY - oy + "px";
          drag.style.pointerEvents = "none";
          const u = document.elementFromPoint(ev.clientX, ev.clientY);
          drag.style.pointerEvents = "";
          document
            .querySelectorAll(".slot")
            .forEach((s) => s.classList.remove("hover"));
          const s = u?.closest(".slot");
          if (
            s &&
            !s.classList.contains("done") &&
            s.dataset.num === drag.dataset.num
          )
            s.classList.add("hover");
        };
        const up = (ev) => {
          this.removeEventListener("pointermove", move);
          this.removeEventListener("pointerup", up);
          document
            .querySelectorAll(".slot")
            .forEach((s) => s.classList.remove("hover"));
          this.style.pointerEvents = "none";
          const u = document.elementFromPoint(ev.clientX, ev.clientY);
          this.style.pointerEvents = "";
          const s = u?.closest(".slot");
          if (
            s &&
            !s.classList.contains("done") &&
            s.dataset.num === this.dataset.num
          ) {
            ding();
            s.classList.add("done");
            s.appendChild(this);
            this.style.position = "";
            this.style.left = "";
            this.style.top = "";
            this.style.width = "";
            this.style.height = "";
            this.style.zIndex = "";
            this.classList.remove("dragging");
            this.style.pointerEvents = "none";
            if (++matched === 10)
              setTimeout(
                () => document.getElementById("popup").classList.add("show"),
                400,
              );
          } else {
            this.style.transition = "all .3s";
            this.style.left = "";
            this.style.top = "";
            this.style.position = "";
            this.style.width = "";
            this.style.height = "";
            this.style.zIndex = "";
            this.classList.remove("dragging");
            document.getElementById("numbers").appendChild(this);
            setTimeout(() => (this.style.transition = ""), 300);
          }
          drag = null;
        };
        this.addEventListener("pointermove", move);
        this.addEventListener("pointerup", up);
      }

      function closePopup() {
        document.getElementById("popup").classList.remove("show");
      }
      document.getElementById("replayBtn").onclick = init;
      document.getElementById("homeBtn").onclick = () =>
        (location.href = HOME_URL);
      document.getElementById("exitBtn").onclick = (e) => {
        e.preventDefault();
        location.href = EXIT_URL;
      };
      init();
    </script>
  </body>
</html>
